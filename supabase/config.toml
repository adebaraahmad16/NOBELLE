project_id = "nobelle"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/account", "http://localhost:5173/account?reset=true", "http://localhost:5173/admin/reset-password"]
minimum_password_length = 12

# Each user function validates the bearer token with Auth getUser itself. This
# also supports publishable API keys and asymmetric JWT signing projects.
[functions.checkout]
verify_jwt = false
[functions.payments]
verify_jwt = false
[functions.staff]
verify_jwt = false
[functions.public-forms]
verify_jwt = false
[functions.paystack-webhook]
verify_jwt = false
[functions.send-notifications]
verify_jwt = false
